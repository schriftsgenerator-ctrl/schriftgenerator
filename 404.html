<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Seite nicht gefunden | Zeichenwerk</title><meta name="robots" content="noindex"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d3a2f'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' text-anchor='middle' fill='%23f3c969'%3EZ%3C/text%3E%3C/svg%3E"><style>
:root{--bg:#f7f4ee;--card:#fffdf9;--ink:#1c1f1d;--muted:#5d655f;--line:#e2ddd2;--accent:#1d3a2f;--accent-2:#c8902b;--soft:#eef2ec;--radius:14px}
@media (prefers-color-scheme:dark){:root{--bg:#121513;--card:#1a1e1b;--ink:#ecefe9;--muted:#a3aba5;--line:#2c322e;--accent:#9fd1b5;--accent-2:#f3c969;--soft:#1f2621}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--accent-2)}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header.site{border-bottom:1px solid var(--line);background:var(--card)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.logo{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1.35rem;color:var(--ink);text-decoration:none}
.logo span{color:var(--accent-2)}
nav ul{display:flex;flex-wrap:wrap;gap:4px 18px;list-style:none;margin:0;padding:0}
nav a{text-decoration:none;color:var(--muted);font-size:.95rem}
nav a[aria-current=page]{color:var(--ink);font-weight:600}
main{padding:32px 0 48px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.2;margin:0 0 12px}
h2{font-family:Georgia,"Times New Roman",serif;font-size:1.55rem;line-height:1.3;margin:44px 0 10px}
h3{font-size:1.1rem;margin:26px 0 6px}
.lead{font-size:1.1rem;color:var(--muted);margin:0 0 24px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.tool label{font-weight:600;display:block;margin-bottom:6px}
.tool textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:var(--bg);color:var(--ink)}
.tool textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:.88rem;color:var(--muted);margin:8px 0 0}
.results{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.results li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.results .name{font-size:.78rem;color:var(--muted);min-width:110px}
.results .out{flex:1;font-size:1.15rem;word-break:break-word;min-width:0}
.results button{border:0;background:var(--accent);color:var(--card);border-radius:8px;padding:7px 12px;font:600 .85rem system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.results button.ok{background:var(--accent-2);color:#1c1f1d}
@media (max-width:560px){.results li{flex-wrap:wrap}.results .name{min-width:100%}}
.box{background:var(--soft);border-radius:var(--radius);padding:16px 18px;margin:20px 0}
.box p:first-child{margin-top:0}.box p:last-child{margin-bottom:0}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.95rem}
.tablewrap{overflow-x:auto}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.85rem;color:var(--muted);font-weight:600}
.cta{display:inline-block;background:var(--accent);color:var(--card);padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:600;margin:6px 0}
.cta:hover{color:var(--card);opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.grid a{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-decoration:none;color:var(--ink)}
.grid a strong{display:block;margin-bottom:4px}
.grid a span{color:var(--muted);font-size:.92rem}
details{border-bottom:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:600}
ol li,ul li{margin:4px 0}
footer.site{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.9rem;background:var(--card)}
footer.site ul{list-style:none;padding:0;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px 18px}
</style></head><body><main><div class="wrap"><h1>Seite nicht gefunden</h1><p>Diese Seite gibt es nicht (mehr). <a href="/">Zurück zum Schriftgenerator</a></p></div></main></body></html>
